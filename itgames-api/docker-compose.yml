version: '3.8'

services:
  # Banco de Dados PostgreSQL 18 Local para Desenvolvimento & Offline
  postgres:
    image: postgres:18-alpine
    container_name: itgames-postgres
    restart: always
    environment:
      POSTGRES_USER: itgames_user
      POSTGRES_PASSWORD: itgames_password
      POSTGRES_DB: itgames_db
    ports:
      - "5433:5432" # Mapeado para 5433 para não colidir com outros bancos locais
    volumes:
      - itgames_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itgames_user -d itgames_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - itgames-network

  # Backend NestJS
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itgames-api
    restart: always
    environment:
      PORT: 3333
      DATABASE_URL: "postgresql://itgames_user:itgames_password@postgres:5432/itgames_db?schema=public"
      DIRECT_URL: "postgresql://itgames_user:itgames_password@postgres:5432/itgames_db?schema=public"
      CORS_ORIGIN: "*"
    ports:
      - "3333:3333" # Acesso HTTP / Swagger em http://localhost:3333/api-docs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - itgames-network

volumes:
  itgames_pgdata:
    driver: local

networks:
  itgames-network:
    driver: bridge
